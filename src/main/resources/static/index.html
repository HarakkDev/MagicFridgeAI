<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MagicFridgeAI</title>
    <style>
        :root {
            --bg: #090c14;
            --bg-gradient: #111827;
            --panel: #111827;
            --panel-soft: #0f172a;
            --primary: #7c3aed;
            --primary-dark: #6d28d9;
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --text: #f3f4f6;
            --muted: #94a3b8;
            --border: #1f2937;
            --success: #34d399;
            --shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Inter, system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, var(--bg-gradient) 0%, var(--bg) 45%);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .panel {
            background: linear-gradient(180deg, #111827 0%, #0b1220 100%);
            border-radius: 18px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 24px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        h2 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 22px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }

        label {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 6px;
            display: block;
        }

        input, select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color .2s;
            background: #0b1220;
            color: var(--text);
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 11px 15px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: transform .08s ease, opacity .2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-danger {
            background: var(--danger);
            padding: 8px 10px;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            background: var(--danger-dark);
        }

        .message {
            margin-top: 12px;
            color: var(--success);
            min-height: 20px;
        }

        .food-list {
            margin-top: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
            gap: 12px;
        }

        .food-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            background: var(--panel-soft);
            display: flex;
            justify-content: space-between;
            gap: 14px;
        }

        .food-name {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .food-info {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.4;
        }

        .recipe-view {
            margin-top: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #0b1220;
            overflow: hidden;
        }

        .recipe-image-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 16px;
            background: #0b1220;
            border-bottom: 1px solid var(--border);
        }

        .recipe-image {
            max-width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #374151;
        }

        .recipe-text {
            padding: 18px;
            color: #e5e7eb;
            line-height: 1.65;
        }

        .recipe-placeholder {
            color: var(--muted);
            padding: 18px;
        }

        .helper {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
<div class="container">
    <section class="panel">
        <h1>🧊 MagicFridgeAI</h1>
        <p class="subtitle">Cadastre ingredientes, remova itens e gere uma receita com imagem em um clique.</p>

        <form id="food-form">
            <div class="grid">
                <div>
                    <label for="nome">Nome</label>
                    <input id="nome" name="nome" type="text" placeholder="Ex.: Leite" required />
                </div>
                <div>
                    <label for="quantidade">Quantidade</label>
                    <input id="quantidade" name="quantidade" type="number" min="1" placeholder="Ex.: 2" required />
                </div>
                <div>
                    <label for="validade">Data de vencimento</label>
                    <input id="validade" name="validade" type="date" required />
                </div>
                <div>
                    <label for="categoria">Categoria</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Selecione...</option>
                        <option value="LATICINIOS">Laticínios</option>
                        <option value="BEBIDAS">Bebidas</option>
                        <option value="HORTIFRUTI">Hortifruti</option>
                        <option value="CARNE">Carne</option>
                        <option value="GRAOS">Grãos</option>
                        <option value="MASSA">Massa</option>
                        <option value="DOCE">Doce</option>
                    </select>
                </div>
            </div>
            <div class="actions">
                <button class="btn-primary" type="submit">Cadastrar ingrediente</button>
                <button class="btn-primary" type="button" id="recipe-btn">Gerar receita + imagem</button>
            </div>
            <div id="message" class="message"></div>
            <p class="helper">A lista é atualizada automaticamente após criar/deletar e também em intervalo periódico.</p>
        </form>
    </section>

    <section class="panel">
        <h2>Ingredientes atuais</h2>
        <div id="food-list" class="food-list"></div>
    </section>

    <section class="panel">
        <h2>Receita gerada</h2>
        <div id="recipe-view" class="recipe-view">
            <p class="recipe-placeholder">Clique em <b>Gerar receita + imagem</b> para visualizar o resultado.</p>
        </div>
    </section>
</div>

<script>
    const form = document.getElementById('food-form');
    const foodList = document.getElementById('food-list');
    const message = document.getElementById('message');
    const recipeBtn = document.getElementById('recipe-btn');
    const recipeView = document.getElementById('recipe-view');

    const setMessage = (text, isError = false) => {
        message.textContent = text;
        message.style.color = isError ? '#f87171' : '#34d399';
    };

    const formatDateTime = (isoDateTime) => {
        if (!isoDateTime) return 'Não informado';
        return new Date(isoDateTime).toLocaleString('pt-BR');
    };

    const extractRecipeFromHtml = (htmlString) => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlString, 'text/html');
        const img = doc.querySelector('img');
        const textContainer = doc.querySelector('div');

        return {
            imageUrl: img?.getAttribute('src') || '',
            recipeHtml: textContainer?.innerHTML || '<p>Não foi possível interpretar a receita retornada.</p>'
        };
    };

    const renderRecipe = ({ imageUrl, recipeHtml }) => {
        const imageSection = imageUrl
            ? `<div class="recipe-image-wrap"><img class="recipe-image" src="${imageUrl}" alt="Imagem da receita gerada" /></div>`
            : '';

        recipeView.innerHTML = `
            ${imageSection}
            <div class="recipe-text">${recipeHtml}</div>
        `;
    };

    async function loadFoods() {
        try {
            const response = await fetch('/food/listar');
            if (!response.ok) throw new Error('Falha ao listar ingredientes.');
            const foods = await response.json();

            if (!foods.length) {
                foodList.innerHTML = '<p class="helper">Nenhum ingrediente cadastrado ainda.</p>';
                return;
            }

            foodList.innerHTML = foods.map(food => `
                <article class="food-card">
                    <div>
                        <p class="food-name">${food.nome}</p>
                        <p class="food-info">Qtd: ${food.quantidade}</p>
                        <p class="food-info">Categoria: ${food.categoria}</p>
                        <p class="food-info">Validade: ${formatDateTime(food.validade)}</p>
                    </div>
                    <div>
                        <button class="btn-danger" data-id="${food.id}">Excluir</button>
                    </div>
                </article>
            `).join('');
        } catch (error) {
            setMessage(error.message, true);
        }
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const formData = new FormData(form);
        const validadeDate = formData.get('validade');

        const payload = {
            nome: formData.get('nome'),
            quantidade: Number(formData.get('quantidade')),
            categoria: formData.get('categoria'),
            validade: `${validadeDate}T23:59:00`
        };

        try {
            const response = await fetch('/food/criar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.text();
            if (!response.ok) throw new Error(result || 'Erro ao cadastrar ingrediente.');

            setMessage(result || 'Ingrediente criado com sucesso!');
            form.reset();
            await loadFoods();
        } catch (error) {
            setMessage(error.message, true);
        }
    });

    foodList.addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-id]');
        if (!button) return;

        const id = button.getAttribute('data-id');

        try {
            const response = await fetch(`/food/deletar/${id}`, { method: 'DELETE' });
            const result = await response.text();
            if (!response.ok) throw new Error(result || 'Erro ao excluir ingrediente.');

            setMessage(result || 'Ingrediente removido com sucesso!');
            await loadFoods();
        } catch (error) {
            setMessage(error.message, true);
        }
    });

    recipeBtn.addEventListener('click', async () => {
        setMessage('Gerando receita e imagem, aguarde...');
        try {
            const response = await fetch('/receita/gerarReceitaImagem');
            const html = await response.text();
            if (!response.ok) throw new Error('Não foi possível gerar receita.');

            const data = extractRecipeFromHtml(html);
            renderRecipe(data);
            setMessage('Receita e imagem atualizadas!');
        } catch (error) {
            setMessage(error.message, true);
        }
    });

    loadFoods();
    setInterval(loadFoods, 15000);
</script>
</body>
</html>
